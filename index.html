<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>프랭클린 플래너</title>
<meta name="theme-color" content="#5b2a20">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="firebase-config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ebe1d1; --bar:#f4ece0; --line:#d9ccb8; --ink:#2b2420; --muted:#8a7d70;
  --paper:#fbf6ec; --paper2:#f5eee1; --rule:#e7dccb;
  --leather:#5b2a20; --leather2:#7a3a2c; --accent:#8e2b22; --accentSoft:#f3dcd6;
  --chip:#fffaf2; --shadow:0 10px 30px rgba(60,30,10,.18);
  --hand:'Noto Sans KR',sans-serif;
}
body.t-navy{--leather:#1f2d48;--leather2:#2f4268;--accent:#2a4d86;--accentSoft:#dbe4f3}
body.t-crimson{--leather:#6e1414;--leather2:#962222;--accent:#b0262a;--accentSoft:#f6d9d9}
body.t-forest{--leather:#1e3d2c;--leather2:#2f5a41;--accent:#2d6a48;--accentSoft:#d8eadf}
body.dark{--bg:#1b1815;--bar:#24201c;--line:#3a332c;--ink:#ece3d6;--muted:#a09484;--paper:#2a2520;--paper2:#25211c;--rule:#3a332b;--chip:#302a24;--accentSoft:#4a2f2a}
body.hand{--hand:'Nanum Pen Script',cursive}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif;font-size:14px;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.serif{font-family:'Gowun Batang',serif}
.ink{font-family:var(--hand)}
body.hand .ink{font-size:1.28em;line-height:1.1}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--bar);border-bottom:1px solid var(--line)}
.row1{display:flex;align-items:center;gap:12px;padding:10px 16px 6px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;white-space:nowrap}
.brand i{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;background:var(--accent);color:#fff;font-style:normal;font-family:'Gowun Batang',serif;font-size:13px}
.tabs{display:flex;gap:2px;margin-left:auto;background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:3px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:6px 11px;border-radius:7px;white-space:nowrap;color:var(--muted);font-size:13px}
.tabs button.on{background:var(--paper);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.row2{display:flex;align-items:center;gap:6px;padding:4px 16px 10px;flex-wrap:wrap}
.dots{display:flex;gap:5px;padding:4px 8px;border:1px solid var(--line);border-radius:999px;background:var(--chip)}
.dots button{width:14px;height:14px;border-radius:50%;border:2px solid transparent;padding:0}
.dots button.on{outline:2px solid var(--ink);outline-offset:1px}
.pill{border:1px solid var(--line);background:var(--chip);border-radius:7px;padding:4px 10px;font-size:12px}
.pill.on{border-color:var(--accent);color:var(--accent);font-weight:700}
#sync{font-size:12px;color:var(--muted);margin-left:auto}
#sync b{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3a9a5b;margin-right:5px;vertical-align:1px}
#sync.pending b,#sync.wait b{background:#d4a017}#sync.local b,#sync.nocfg b{background:#999}#sync.offline b{background:#6b7fa8}#sync.err b{background:#c0392b}
/* binder */
.wrap{padding:16px;max-width:1280px;margin:0 auto}
.binder{position:relative;background:linear-gradient(145deg,var(--leather2),var(--leather) 60%);border-radius:20px;padding:16px 44px 16px 16px;box-shadow:var(--shadow),inset 0 0 0 2px rgba(255,255,255,.06)}
.binder:before{content:"";position:absolute;inset:7px;border:1px dashed rgba(255,255,255,.18);border-radius:15px;pointer-events:none}
.pages{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--paper);border-radius:8px;min-height:640px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.pages.single{grid-template-columns:1fr}
.page{padding:22px 26px;min-width:0}
.pages:not(.single) .page:first-child{border-right:1px solid var(--rule);background:linear-gradient(90deg,var(--paper) 92%,var(--paper2))}
.pages:not(.single) .page:last-child{background:linear-gradient(270deg,var(--paper) 92%,var(--paper2))}
.rings{position:absolute;top:0;bottom:0;left:50%;width:0;pointer-events:none}
.rings span{position:absolute;left:-22px;width:44px;height:9px;border-radius:5px;background:linear-gradient(180deg,#f2f2f2,#9a9a9a 55%,#cfcfcf);box-shadow:0 1px 2px rgba(0,0,0,.35)}
.pages.single .rings{left:0}.pages.single .rings span{left:-30px;width:42px}
.mtabs{position:absolute;right:6px;top:30px;bottom:30px;display:flex;flex-direction:column;gap:3px;width:32px}
.mtabs button{flex:1;border:0;border-radius:0 7px 7px 0;font-size:11px;writing-mode:vertical-rl;color:#3b3029;padding:0;min-height:22px;font-weight:500;opacity:.9}
.mtabs button.on{transform:translateX(4px);font-weight:700;opacity:1;box-shadow:2px 1px 4px rgba(0,0,0,.25)}
/* common */
h2.ttl{font-family:'Gowun Batang',serif;font-size:22px;margin:0 0 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sec{font-weight:700;font-size:14px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.sec small{font-weight:400;font-size:10px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.sec .r{margin-left:auto}
.btn{white-space:nowrap;border:1px solid var(--line);background:var(--chip);border-radius:7px;padding:5px 10px;font-size:12px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.inp{border:1px solid var(--line);background:var(--chip);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
.inp:focus,textarea:focus{outline:2px solid var(--accentSoft);border-color:var(--accent)}
.bare{border:0;background:transparent;padding:4px 2px;width:100%;min-width:0}
.bare:focus{outline:none;background:var(--accentSoft);border-radius:4px}
.muted{color:var(--muted)}
.x{border:0;background:none;color:var(--muted);font-size:15px;padding:0 4px;line-height:1}
.x:hover{color:var(--accent)}
.navbtns{display:flex;gap:4px;align-items:center;font-size:13px;font-family:"Noto Sans KR",sans-serif;font-weight:400}
.navbtns button{border:1px solid var(--line);background:var(--chip);border-radius:6px;min-width:28px;height:28px;padding:0 8px}
.ruled{background-image:repeating-linear-gradient(var(--paper) 0 27px,var(--rule) 27px 28px);line-height:28px;border:0;width:100%;resize:vertical;padding:0 4px;background-attachment:local}
/* daily */
.dhead{display:flex;align-items:flex-end;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:8px}
.bignum{font-family:'Gowun Batang',serif;font-size:58px;line-height:.85;color:var(--accent);font-weight:700}
.dhead .wdn{font-family:'Gowun Batang',serif;font-size:18px;font-weight:700}
.dhead .sub{font-size:11px;color:var(--muted);margin-top:3px}
.dhead .cnt{margin-left:auto;text-align:right;font-size:11px;color:var(--muted);line-height:1.6}
.dhead .cnt b{color:var(--ink);font-size:13px}
.quote{font-family:'Gowun Batang',serif;font-style:italic;text-align:center;color:var(--muted);font-size:12px;margin:10px 0 16px}
.dcols{display:grid;grid-template-columns:1.05fr 1fr;gap:18px}
.legend{font-size:11px;color:var(--muted);margin-bottom:8px}
.addrow{display:flex;gap:6px;margin-bottom:8px}
.addrow select{width:auto;flex:none}
.task{display:grid;grid-template-columns:26px 30px 1fr 18px;align-items:center;border-bottom:1px solid var(--rule);min-height:32px}
.task .st{width:22px;height:22px;border:1px solid var(--line);border-radius:5px;background:var(--chip);font-size:13px;padding:0;line-height:1}
.task .lb{font-family:'Gowun Batang',serif;font-weight:700;color:var(--accent);font-size:13px}
.task.s-done .bare,.task.s-del .bare{text-decoration:line-through;color:var(--muted)}
.task.s-fwd .bare,.task.s-dlg .bare{color:var(--muted)}
.tbtns{display:flex;gap:6px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
.allday{font-size:12px;background:var(--accentSoft);border-left:3px solid var(--accent);border-radius:4px;padding:4px 8px;margin-bottom:4px;cursor:pointer}
.grid{position:relative;margin-top:6px}
.slot{height:24px;border-top:1px solid var(--rule);display:flex;cursor:pointer}
.slot:hover{background:var(--accentSoft)}
.slot .h{width:34px;font-size:12px;font-weight:700;color:var(--muted);text-align:right;padding-right:6px;transform:translateY(-8px);background:var(--paper)}
.slot.half{border-top-style:dashed}
.slot.half .h{font-size:9px;font-weight:400}
.appt{position:absolute;border-radius:4px;padding:2px 5px;font-size:11px;overflow:hidden;cursor:pointer;line-height:1.3;border-left:3px solid;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.appt b{display:block;font-size:10px;font-weight:500;opacity:.8}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;border-bottom:1px solid var(--rule);padding-bottom:12px}
.mini{font-size:10px;text-align:center}
.mini .mh{font-family:'Gowun Batang',serif;font-weight:700;font-size:12px;margin-bottom:3px;cursor:pointer}
.mini table{width:100%;border-collapse:collapse}
.mini td,.mini th{padding:1px 0;font-weight:400}
.mini th{color:var(--accent);font-size:9px}
.mini td{cursor:pointer;border-radius:3px;position:relative}
.mini td:hover{background:var(--accentSoft)}
.mini td.sun,.mini th.sun{color:#c0392b}.mini td.sat,.mini th.sat{color:#2e6da4}
.mini td.today{background:var(--ink);color:var(--paper)!important;font-weight:700}
.mini td.sel{outline:1.5px solid var(--accent)}
.mini td.has:after{content:"";position:absolute;left:50%;bottom:0;width:3px;height:3px;border-radius:50%;background:var(--accent);transform:translateX(-50%)}
.virtue{margin:14px 0;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--paper2)}
.virtue .k{font-size:10px;color:var(--muted);letter-spacing:.05em}
.virtue .n{font-family:'Gowun Batang',serif;font-size:18px;font-weight:700;margin:2px 0}
.virtue .d{font-size:12px;color:var(--muted)}
.vchk{display:flex;gap:4px;margin-top:8px;align-items:center;font-size:11px;color:var(--muted)}
.vchk button{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:var(--chip);font-size:9px;padding:0}
.vchk button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.vchk button.today{outline:1.5px solid var(--accent);outline-offset:1px}
.posts{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.post{position:relative;width:150px;min-height:120px;background:#fbe98a;box-shadow:2px 3px 6px rgba(0,0,0,.18);transform:rotate(-1.2deg);padding:14px 8px 8px}
.post:nth-child(2n){transform:rotate(1.4deg);background:#f9d3dc}
.post:nth-child(3n){background:#cfe8f5}
.post textarea{width:100%;height:100px;border:0;background:transparent;resize:none;color:#3a2f22;font-family:'Nanum Pen Script',cursive;font-size:18px;line-height:1.1}
.post textarea:focus{outline:none}
.post .x{position:absolute;right:2px;top:0;color:#8a6d3b}
/* weekly */
.week{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.wd{border-right:1px solid var(--rule);min-height:300px;padding:8px;min-width:0}
.wd:last-child{border-right:0}
.wd .wh{display:flex;align-items:baseline;gap:5px;cursor:pointer;margin-bottom:6px;border-bottom:1px solid var(--rule);padding-bottom:4px}
.wd .wh b{font-family:'Gowun Batang',serif;font-size:20px}
.wd.today{background:var(--accentSoft)}
.wi{font-size:11px;padding:2px 0;border-bottom:1px dotted var(--rule);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wi.ap{color:var(--accent)}
.wi.done{text-decoration:line-through;color:var(--muted)}
.focus{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:16px}
.li{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--rule);min-height:32px}
.li input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;flex:none}
.li.done .bare{text-decoration:line-through;color:var(--muted)}
/* monthly */
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
.mgrid .hd{font-size:11px;text-align:center;padding:5px 0;font-weight:700;color:var(--muted);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.mc{min-height:96px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:4px 5px;cursor:pointer;min-width:0;overflow:hidden}
.mc:hover{background:var(--accentSoft)}
.mc.out{opacity:.35}
.mc .n{font-family:'Gowun Batang',serif;font-weight:700;font-size:14px}
.mc.today .n{background:var(--ink);color:var(--paper);border-radius:50%;display:inline-grid;place-items:center;width:22px;height:22px}
.mc .e .tm{opacity:.65;font-size:.9em}
.gban{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;background:var(--accentSoft);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:0 0 12px;font-size:12.5px}
.mc .e{font-size:10.5px;border-radius:3px;padding:0 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sun{color:#c0392b}.sat{color:#2e6da4}
/* yearly */
.year{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.year .mini{font-size:11px}
.year .mini .mh{font-size:14px}
/* mandal */
.mtop{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.mtop select{width:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border-radius:999px;padding:3px 10px;font-size:11px;border:1px solid rgba(0,0,0,.08)}
.mandal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:900px;margin:0 auto}
.mb{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--line);border-radius:4px;overflow:hidden}
.mb textarea{aspect-ratio:1/1;border:0;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);background:transparent;resize:none;text-align:center;font-size:12px;padding:6px 3px;width:100%;min-width:0;display:block}
.mb textarea:nth-child(3n){border-right:0}
.mb textarea:nth-child(n+7){border-bottom:0}
.mb textarea:focus{outline:2px solid var(--accent);outline-offset:-2px}
.mb textarea.core{background:var(--accent)!important;color:#fff;font-weight:700}
/* checklist */
.prog{height:4px;background:var(--rule);border-radius:2px;margin:6px 0 10px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:2px}
.lchip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:5px 12px;font-size:12px}
.lchip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.grp{margin-bottom:18px}
.grp h4{margin:0 0 4px;font-size:12px;color:var(--accent)}
.vrow{display:grid;grid-template-columns:150px 1fr 20px;gap:8px;align-items:center;border-bottom:1px solid var(--rule);min-height:34px}
.grow{display:grid;grid-template-columns:20px 1fr 90px 130px 20px;gap:8px;align-items:center;border-bottom:1px solid var(--rule);min-height:34px}
.grow.done .bare{text-decoration:line-through;color:var(--muted)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(20,10,5,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{background:var(--paper);border-radius:12px;padding:20px;width:min(440px,100%);box-shadow:var(--shadow);max-height:90vh;overflow:auto}
.modal h3{margin:0 0 12px;font-family:'Gowun Batang',serif}
.modal label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.modal .acts{display:flex;gap:6px;justify-content:flex-end;margin-top:16px}
.modal .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.swatches{display:flex;gap:6px}
.swatches button{width:24px;height:24px;border-radius:50%;border:2px solid transparent}
.swatches button.on{border-color:var(--ink)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-size:13px;z-index:60}
@media (max-width:900px){
  .pages{grid-template-columns:1fr}
  .pages:not(.single) .page:first-child{border-right:0;border-bottom:1px dashed var(--rule)}
  .rings{display:none}
  .dcols{grid-template-columns:1fr}
  .year{grid-template-columns:repeat(2,1fr)}
  .week{grid-template-columns:1fr}
  .wd{border-right:0;border-bottom:1px solid var(--rule);min-height:auto}
  .focus{grid-template-columns:1fr}
}
@media (max-width:600px){
  .wrap{padding:8px}
  .binder{padding:8px 30px 8px 8px;border-radius:14px}
  .mtabs{width:22px;right:4px}
  .mtabs button{font-size:9px}
  .page{padding:16px 14px}
  .bignum{font-size:46px}
  .mc{min-height:60px;padding:2px}
  .mc .e{font-size:9px;padding:0 2px}
  .mc .e .tm{display:none}
  .mc .e{white-space:normal;word-break:break-all;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;padding:1px 2px}
  .mc{min-height:72px;padding:2px 1px}
  .pages.single .page{padding-left:14px!important;padding-right:10px}
  .mgrid .hd{font-size:10px}
  .mb textarea{font-size:9.5px;padding:3px 1px}
  .mandal{gap:4px}
  .vrow{grid-template-columns:1fr 20px}.vrow .bare:nth-child(2){grid-column:1}
  .grow{grid-template-columns:20px 1fr 20px}.grow select,.grow input[type=date]{grid-column:2}
  .row1{padding:8px 10px 4px}.row2{padding:4px 10px 8px}
  .tabs{margin-left:0;width:100%}
}
</style>
</head>
<body>
<div class="top">
  <div class="row1">
    <div class="brand"><i>F</i>프랭클린 플래너</div>
    <nav class="tabs" id="tabs"></nav>
  </div>
  <div class="row2">
    <div class="dots" id="dots"></div>
    <button class="pill" data-act="hand" id="handBtn">✍ 손글씨</button>
    <button class="pill" data-act="dark" id="darkBtn">◐ 다크</button>
    <button class="pill" data-act="export">내보내기</button>
    <button class="pill" data-act="import">가져오기</button>
    <button class="pill" data-act="acct" id="acct">🔑 로그인</button>
    <span id="sync" class="local"><b></b>이 기기에만 저장</span>
  </div>
</div>
<div class="wrap">
  <div class="binder">
    <div class="pages" id="pages"></div>
    <div class="mtabs" id="mtabs"></div>
  </div>
</div>
<div id="modalRoot"></div>

<script>
/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nid=()=>Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const addMonths=(ym,n)=>{const[y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+n,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`};
const WD=['일','월','화','수','목','금','토'];
const TODAY=()=>ymd(new Date());

const MCOL=['#e8b4b4','#e9c9a6','#e6dc9f','#c4dfae','#a9d6c9','#a9c8e3','#bdb4e3','#dcb4dd','#e3b7c8','#d9c3a5','#b9d3b0','#c3c9de'];

function writeKey(key){
  if(!user||!FB)return;
  let id,patch={},n=0;
  if(key==='main'){id='main';for(const f of Object.keys(S.main)){const j=JSON.stringify(S.main[f]??null);if(last['main.'+f]!==j){patch[f]=S.main[f]??null;last['main.'+f]=j;n++}}}

let unsub=null;
function listen(){
  firstServer=false;last={};
  unsub=FB.onSnapshot(FB.collection(fdb,'users',user.uid,'planner'),{includeMetadataChanges:true},snap=>{
    pendingMeta=snap.metadata.hasPendingWrites;
    if(!firstServer&&!snap.metadata.fromCache){firstServer=true;
      if(snap.empty){if(localHasData())pushAll();updateSync();return}}
    let changed=false;
    snap.docChanges().forEach(ch=>{if(ch.type==='removed')return;const d=ch.doc;if(timers[d.id])return;const b=d.data();if(!b)return;
      if(d.id==='main'){const nm={...defaultMain(),...b};delete nm.days;if(JSON.stringify(nm)!==JSON.stringify(S.main)){S.main=nm;changed=true}Object.keys(nm).forEach(f=>last['main.'+f]=JSON.stringify(nm[f]??null))}
      else if(d.id.startsWith('m-')){const ym=d.id.slice(2);const days=b.days||{};const cur=S.months[ym]||{days:{}};
        if(JSON.stringify(days)!==JSON.stringify(cur.days)){S.months[ym]={days};changed=true}Object.keys(days).forEach(k=>last['day.'+k]=JSON.stringify(days[k]))}});

function monthsFor(){const v=ui.view;let base=v==='monthly'?ui.ym:ui.date.slice(0,7);

  return [addMonths(base,-1),base,addMonths(base,1)]}
function hm(d){return pad(d.getHours())+':'+pad(d.getMinutes())}
function gAdd(store,cal,ev){
  if(ev.status==='cancelled'||!ev.start)return;
  const base={id:ev.id,cal,title:ev.summary||'(제목 없음)',loc:ev.location||'',link:ev.htmlLink||''};
  const push=(d,o)=>{(store[d]??=[]).push(o)};
  if(ev.start.date){let d=ev.start.date;const end=ev.end&&ev.end.date||addDays(d,1);while(d<end){push(d,{...base,allDay:true,start:'',end:''});d=addDays(d,1)}return}
  const s=new Date(ev.start.dateTime),e=new Date(ev.end.dateTime);const sd=ymd(s),ed=ymd(new Date(e-1));
  const eh=hm(e)==='00:00'?'24:00':hm(e);
  if(sd===ed){push(sd,{...base,allDay:false,start:hm(s),end:eh});return}
  push(sd,{...base,allDay:false,start:hm(s),end:'24:00'});
  let d=addDays(sd,1);while(d<ed){push(d,{...base,allDay:true,start:'',end:'',title:base.title+' (계속)'});d=addDays(d,1)}
  push(ed,{...base,allDay:false,start:'00:00',end:eh});
}
async function gRefresh(force){

    G.cals=(L.items||[]).map(c=>({id:c.id,summary:c.summaryOverride||c.summary||c.id,backgroundColor:c.backgroundColor,selected:c.selected!==false,primary:!!c.primary}));
    if(need.length){

}

function miniCal(ym,opts={}){const[y,m]=ym.split('-').map(Number);const first=new Date(y,m-1,1).getDay();const n=new Date(y,m,0).getDate();const t=TODAY();

function weekOfYear(ds){const d=parse(ds);const s=new Date(d.getFullYear(),0,1);return Math.floor(((d-s)/864e5+s.getDay())/7)}
function sundayOf(ds){const d=parse(ds);d.setDate(d.getDate()-d.getDay());return ymd(d)}
function layoutAppts(list){const a=list.filter(x=>!x.allDay).map(x=>({...x,s:toMin(x.start),e:Math.max(toMin(x.end),toMin(x.start)+30)})).sort((p,q)=>p.s-q.s);
  const cols=[];a.forEach(x=>{let c=cols.findIndex(end=>end<=x.s);if(c<0){c=cols.length;cols.push(0)}cols[c]=x.e;x.c=c});
  // group clusters to compute widths
  let cl=[],end=-1;const out=[];a.forEach(x=>{if(x.s>=end&&cl.length){fin(cl);cl=[]}cl.push(x);end=Math.max(end,x.e)});if(cl.length)fin(cl);
  function fin(g){const used=[...new Set(g.map(x=>x.c))].sort((p,q)=>p-q);g.forEach(x=>{x.n=used.length;x.ci=used.indexOf(x.c);out.push(x)})}
  return out}

function vYearly(){const y=ui.year;
  return `<div class="pages single"><section class="page" style="padding-left:34px">
  <h2 class="ttl">${y}년 연간 계획 <span class="navbtns" style="margin-left:auto"><button data-act="prev">‹</button><button data-act="today">올해</button><button data-act="next">›</button></span></h2>
  <div class="year">${Array.from({length:12},(_,i)=>miniCal(`${y}-${pad(i+1)}`)).join('')}</div>
  <p class="muted" style="font-size:12px;margin-top:16px">점이 찍힌 날은 일정·업무·기록이 있는 날이에요. 날짜를 누르면 그날 페이지로 이동해요.</p>
  </section>${rings(7)}</div>`}

function curMandal(){const m=S.main;if(!m.mandals||!m.mandals.length){m.mandals=defaultMain().mandals}return m.mandals.find(x=>x.id===m.curMandal)||m.mandals[0]}
function vMandal(){const md=curMandal(),g=md.g;
  const subs=[0,1,2,3,5,6,7,8];
  const chips=subs.map((b,i)=>{const filled=g[b].filter((v,c)=>c!==4&&v.trim()).length;return `<span class="chip" style="background:${PAL[i]}">${esc(g[4][b]||'세부 목표 '+(i+1))} · ${filled}/8</span>`}).join('');
  const blocks=Array.from({length:9},(_,b)=>`<div class="mb" style="border-color:${b===4?'var(--accent)':PAL[subs.indexOf(b)]}">${Array.from({length:9},(_,c)=>{
    let bg='',ph='',cls='';
    if(b===4&&c===4){cls='core';ph='핵심 목표'}
    else if(b===4){bg=PAL[subs.indexOf(c)];ph='세부 목표 '+(subs.indexOf(c)+1)}
    else if(c===4){bg=PAL[subs.indexOf(b)];ph='세부 목표 '+(subs.indexOf(b)+1)}
    else ph='';
    return `<textarea class="ink ${cls}" data-bind="mand" data-b="${b}" data-c="${c}" placeholder="${ph}" style="${bg?'background:'+bg+';color:#3a2f22':''}">${esc(g[b][c])}</textarea>`}).join('')}</div>`).join('');
  return `<div class="pages single"><section class="page" style="padding-left:34px">
  <h2 class="ttl">만다라트 · Mandal-Art</h2>
  <div class="mtop"><select class="inp" data-bind="msel">${S.main.mandals.map(x=>`<option value="${x.id}" ${x.id===md.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
    <input class="inp" style="flex:1;min-width:140px" data-bind="mname" value="${esc(md.name)}">
    <button class="btn" data-act="mnew">+ 새 만다라트</button><button class="btn" data-act="mdel">삭제</button></div>
  <div class="chips">${chips}</div>
  <div class="mandal">${blocks}</div>
  <p class="muted" style="font-size:12px;margin-top:12px">가운데에 핵심 목표, 그 주위 8칸에 세부 목표를 적으면 바깥 블록의 가운데에 자동으로 옮겨져요. 바깥 블록에는 세부 목표별 실천 과제 8개를 채워 보세요.</p>
  </section>${rings(7)}</div>`}

function curList(){const m=S.main;return m.checklists.find(x=>x.id===m.curList)||m.checklists[0]}
function vCheck(){const L=curList();const done=L?L.items.filter(i=>i.done).length:0,n=L?L.items.length:0;
  return `<div class="pages single"><section class="page" style="padding-left:34px">
  <h2 class="ttl">체크리스트</h2>
  <div class="mtop">${S.main.checklists.map(l=>`<button class="lchip ${L&&l.id===L.id?'on':''}" data-act="clsel" data-id="${l.id}">${esc(l.name||'제목 없음')} <span style="opacity:.7">${l.items.filter(i=>i.done).length}/${l.items.length}</span></button>`).join('')}
    <button class="btn" data-act="clnew">+ 새 체크리스트</button>
    <select class="inp" data-bind="cltpl" style="width:auto"><option value="">템플릿에서 만들기…</option>${Object.keys(TEMPLATES).map(k=>`<option>${k}</option>`).join('')}</select></div>
  ${L?`<div style="display:flex;gap:8px;margin-top:6px"><input class="inp serif" style="font-size:16px;font-weight:700" data-bind="clname" value="${esc(L.name)}" placeholder="체크리스트 이름"><input type="date" class="inp" style="width:150px" data-bind="cldate" value="${esc(L.date||'')}"><button class="btn" data-act="cllistdel">삭제</button></div>
  <div class="prog"><i style="width:${n?done/n*100:0}%"></i></div><div class="muted" style="font-size:11px;text-align:right;margin-top:-6px">${done}/${n} 완료 · ${n?Math.round(done/n*100):0}%</div>
  ${L.items.map(i=>`<div class="li ${i.done?'done':''}"><input type="checkbox" data-act="cltog" data-id="${i.id}" ${i.done?'checked':''}><input class="bare ink" data-bind="clitem" data-id="${i.id}" value="${esc(i.t)}"><button class="x" data-act="clidel" data-id="${i.id}">×</button></div>`).join('')}
  <div class="addrow" style="margin-top:10px"><input class="inp" id="newcl" placeholder="항목 추가 (Enter)"><button class="btn" data-act="cladd">추가</button></div>`
  :'<p class="muted">아직 체크리스트가 없어요. 새로 만들거나 템플릿에서 시작해 보세요.</p>'}
  </section>${rings(7)}</div>`}

const MCATS=['업무','개인','아이디어','언젠가'];
function vMaster(){const M=S.main.master;
  return `<div class="pages"><section class="page">
  <h2 class="ttl">마스터 업무 목록</h2>
  <p class="muted" style="font-size:12px;margin-top:-6px">날짜가 정해지지 않은 할 일을 모두 모아두는 곳이에요. 매일 아침 여기서 골라 오늘 목록으로 옮기세요.</p>
  <div class="addrow"><select class="inp" id="newmc">${MCATS.map(c=>`<option>${c}</option>`).join('')}</select><input class="inp" id="newm" placeholder="할 일 (Enter)"><button class="btn pri" data-act="madd">추가</button></div>
  ${MCATS.slice(0,2).map(c=>grp(c)).join('')}
  </section><section class="page">${MCATS.slice(2).map(c=>grp(c)).join('')}</section>${rings(6)}</div>`;
  function grp(c){const it=M.filter(x=>x.cat===c);return `<div class="grp"><h4>${c} <span class="muted">${it.length}</span></h4>${it.map(x=>`<div class="li ${x.done?'done':''}"><input type="checkbox" data-act="mtog" data-id="${x.id}" ${x.done?'checked':''}><input class="bare ink" data-bind="master" data-id="${x.id}" value="${esc(x.t)}"><button class="btn" style="padding:2px 7px;flex:none" data-act="mtoday" data-id="${x.id}" title="오늘 업무로 보내기">오늘 →</button><button class="x" data-act="mdel2" data-id="${x.id}">×</button></div>`).join('')||'<div class="muted" style="font-size:12px">비어 있음</div>'}</div>`}}

function vValues(){const m=S.main;
  return `<div class="pages"><section class="page">
  <h2 class="ttl">사명서 · Mission</h2>
  <textarea class="ruled ink" rows="8" data-bind="mission" placeholder="나는 어떤 사람이 되고 싶은가? 무엇을 하며 살고 싶은가? 무엇을 남기고 싶은가?">${esc(m.mission)}</textarea>
  <div class="sec" style="margin-top:20px">지배 가치 <small>Governing values</small><button class="btn r" data-act="valadd">+ 가치</button></div>
  ${m.values.map((v,i)=>`<div class="vrow"><input class="bare serif" style="font-weight:700" data-bind="valname" data-id="${v.id}" value="${esc(v.name)}" placeholder="${i+1}. 가치 이름"><input class="bare ink" data-bind="valdesc" data-id="${v.id}" value="${esc(v.desc)}" placeholder="이 가치를 지킨다는 것은…"><button class="x" data-act="valdel" data-id="${v.id}">×</button></div>`).join('')||'<p class="muted" style="font-size:12px">가장 중요하게 여기는 가치를 우선순위대로 적어 보세요. 예) 가족, 정직, 성장, 건강</p>'}
  </section><section class="page">
  <div class="sec">목표 <small>Goals</small><button class="btn r" data-act="goaladd">+ 목표</button></div>
  ${['장기','중기','단기'].map(k=>{const gs=m.goals.filter(g=>g.cat===k);return `<div class="grp"><h4>${k} 목표 <span class="muted">${gs.filter(g=>g.done).length}/${gs.length}</span></h4>${gs.map(g=>`<div class="grow ${g.done?'done':''}"><input type="checkbox" data-act="goaltog" data-id="${g.id}" ${g.done?'checked':''}><input class="bare ink" data-bind="goalt" data-id="${g.id}" value="${esc(g.t)}" placeholder="목표"><select class="bare" data-bind="goalcat" data-id="${g.id}">${['장기','중기','단기'].map(c=>`<option ${c===g.cat?'selected':''}>${c}</option>`).join('')}</select><input type="date" class="bare" data-bind="goaldue" data-id="${g.id}" value="${esc(g.due||'')}"><button class="x" data-act="goaldel" data-id="${g.id}">×</button></div>`).join('')||'<div class="muted" style="font-size:12px">—</div>'}</div>`}).join('')}
  <p class="muted" style="font-size:12px">장기(3년 이상) → 중기(1년) → 단기(분기·월) 순서로 쪼개고, 단기 목표는 주간의 큰 돌로 옮기세요.</p>
  </section>${rings(6)}</div>`}

const VFN={daily:vDaily,weekly:vWeekly,monthly:vMonthly,yearly:vYearly,mandal:vMandal,check:vCheck,master:vMaster,values:vValues,gcal:vGcal};
function render(){renderChrome();const html=VFN[ui.view]();const tmp=document.createElement('div');tmp.innerHTML=html;const el=tmp.firstElementChild;el.id='pages';$('#pages').replaceWith(el);setTimeout(gAuto,0)}

/* ---------- modal ---------- */
function closeModal(){$('#modalRoot').innerHTML=''}
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),1800)}
function apptModal(ds,a,startT){const isNew=!a;a=a||{id:nid(),title:'',start:startT||'09:00',end:(()=>{const m=toMin(startT||'09:00')+60;return pad(Math.min(23,Math.floor(m/60)))+':'+pad(m%60)})(),allDay:false,color:ACOL[1]};
  let color=a.color||ACOL[0];
  $('#modalRoot').innerHTML=`<div class="modal" data-act="mbg"><div class="box">
    <h3>${isNew?'새 일정':'일정 수정'} · ${ds.slice(5).replace('-','/')}</h3>
    <label>제목</label><input class="inp" id="aT" value="${esc(a.title)}" placeholder="예) SC 62A/WG 41 회의">
    <label><input type="checkbox" id="aAll" ${a.allDay?'checked':''}> 종일</label>
    <div class="two" id="aTimes"><div><label>시작</label><input type="time" class="inp" id="aS" value="${esc(a.start)}" step="1800"></div><div><label>끝</label><input type="time" class="inp" id="aE" value="${esc(a.end)}" step="1800"></div></div>
    <label>색상</label><div class="swatches">${ACOL.map(c=>`<button data-act="swatch" data-c="${c}" style="background:${c}" class="${c===color?'on':''}"></button>`).join('')}</div>
    <div class="acts">${isNew?'':'<button class="btn" data-act="apptdel">삭제</button>'}<span style="flex:1"></span><button class="btn" data-act="close">취소</button><button class="btn pri" data-act="apptsave">저장</button></div>
  </div></div>`;
  $('#aT').focus();
  modalCtx={kind:'appt',ds,a,isNew,get color(){return color},set color(v){color=v}};}
let modalCtx=null;
function textModal(title,val,ro,onOk){
  $('#modalRoot').innerHTML=`<div class="modal" data-act="mbg"><div class="box"><h3>${title}</h3>
  <textarea class="inp" id="mt" rows="10" style="font-family:monospace;font-size:11px" ${ro?'readonly':''}>${esc(val)}</textarea>
  <div class="acts"><button class="btn" data-act="close">닫기</button>${ro?'<button class="btn" data-act="savefile">파일로 저장</button><button class="btn pri" data-act="copy">복사</button>':'<label class="btn" style="margin:0;color:inherit;font-size:12px">파일 열기<input type="file" accept=".json,application/json" id="impf" hidden></label><button class="btn pri" data-act="doimport">불러오기</button>'}</div></div></div>`;
  modalCtx={kind:'text',onOk}}

/* ---------- actions ---------- */
function shift(n){const v=ui.view;
  if(v==='daily')ui.date=addDays(ui.date,n);
  else if(v==='weekly')ui.date=addDays(ui.date,7*n);
  else if(v==='monthly')ui.ym=addMonths(ui.ym,n);
  else if(v==='yearly')ui.year+=n;render()}
function addTask(){const inp=$('#newtask');const t=inp.value.trim();if(!t)return;const p=$('#newp').value;const day=getDay(ui.date,true);
  const n=Math.max(0,...day.tasks.filter(x=>x.p===p).map(x=>x.n))+1;day.tasks.push({id:nid(),p,n,t,s:''});touch(dayKey(ui.date));render();const ni=$('#newtask');ni&&ni.focus();$('#newp').value=p}
function findIn(arr,id){return arr.find(x=>x.id===id)}
function weekObj(){const k=sundayOf(ui.date);S.main.weeks??={};S.main.weeks[k]??={focus:[],roles:''};S.main.weeks[k].focus??=[];return S.main.weeks[k]}
function newChecklist(name,items){const l={id:nid(),name,date:'',items:(items||[]).map(t=>({id:nid(),t,done:false}))};S.main.checklists.push(l);S.main.curList=l.id;touch('main');render()}

const ACT={
  view:el=>{ui.view=el.dataset.v;if(ui.view==='monthly')ui.ym=ui.date.slice(0,7);if(ui.view==='yearly')ui.year=+ui.date.slice(0,4);try{history.replaceState(null,'','#'+ui.view)}catch(e){}render();window.scrollTo(0,0)},
  prev:()=>shift(-1),next:()=>shift(1),
  today:()=>{ui.date=TODAY();ui.ym=ui.date.slice(0,7);ui.year=+ui.date.slice(0,4);render()},
  goto:el=>{ui.date=el.dataset.d;ui.view='daily';try{history.replaceState(null,'','#daily')}catch(e){}render();window.scrollTo(0,0)},
  gomonth:el=>{const y=ui.view==='yearly'?ui.year:+(ui.view==='monthly'?ui.ym:ui.date).slice(0,4);ui.ym=`${y}-${pad(el.dataset.m)}`;ui.view='monthly';render()},
  gomonthym:el=>{ui.ym=el.dataset.ym;ui.view='monthly';render()},
  theme:el=>{S.main.theme=el.dataset.t;touch('main');applyPrefs()},
  dark:()=>{S.main.dark=!S.main.dark;touch('main');applyPrefs()},
  hand:()=>{S.main.hand=!S.main.hand;touch('main');applyPrefs()},
  taskadd:addTask,
  tstat:el=>{const day=getDay(ui.date,true),t=findIn(day.tasks,el.dataset.id);if(!t)return;t.s=STAT_ORDER[(STAT_ORDER.indexOf(t.s||'')+1)%STAT_ORDER.length];touch(dayKey(ui.date));render()},
  tdel:el=>{const day=getDay(ui.date,true);day.tasks=day.tasks.filter(x=>x.id!==el.dataset.id);touch(dayKey(ui.date));render()},
  renum:()=>{const day=getDay(ui.date,true);['A','B','C'].forEach(p=>{day.tasks.filter(x=>x.p===p).sort((a,b)=>a.n-b.n).forEach((x,i)=>x.n=i+1)});touch(dayKey(ui.date));render()},
  forward:()=>{const day=getDay(ui.date,true);const nx=addDays(ui.date,1);const nd=getDay(nx,true);let c=0;
    day.tasks.filter(x=>x.s===''||x.s==='prog').forEach(x=>{x.s='fwd';const n=Math.max(0,...nd.tasks.filter(y=>y.p===x.p).map(y=>y.n))+1;nd.tasks.push({id:nid(),p:x.p,n,t:x.t,s:''});c++});
    touch(dayKey(ui.date));touch(dayKey(nx));render();toast(c?`${c}개 업무를 내일로 옮겼어요`:'옮길 미완료 업무가 없어요')},
  apptnew:el=>apptModal(ui.date,null,el.dataset.t),
  apptedit:el=>{const a=findIn(getDay(ui.date).appts,el.dataset.id);if(a)apptModal(ui.date,a)},
  swatch:el=>{modalCtx.color=el.dataset.c;document.querySelectorAll('.swatches button').forEach(b=>b.classList.toggle('on',b===el))},
  apptsave:()=>{const c=modalCtx;const day=getDay(c.ds,true);const t=$('#aT').value.trim()||'(제목 없음)';let s=$('#aS').value||'09:00',e=$('#aE').value||s;if(toMin(e)<=toMin(s)){const m=toMin(s)+30;e=pad(Math.min(23,Math.floor(m/60)))+':'+pad(m%60)}
    const obj={id:c.a.id,title:t,start:s,end:e,allDay:$('#aAll').checked,color:c.color};
    if(c.isNew)day.appts.push(obj);else{const i=day.appts.findIndex(x=>x.id===obj.id);if(i>=0)day.appts[i]=obj}
    touch(dayKey(c.ds));closeModal();render()},
  apptdel:()=>{const c=modalCtx;const day=getDay(c.ds,true);day.appts=day.appts.filter(x=>x.id!==c.a.id);touch(dayKey(c.ds));closeModal();render()},
  close:closeModal,
  mbg:(el,e)=>{if(e.target===el)closeModal()},
  postadd:()=>{getDay(ui.date,true).posts.push({id:nid(),text:''});touch(dayKey(ui.date));render();const ps=document.querySelectorAll('.post textarea');ps.length&&ps[ps.length-1].focus()},
  postdel:el=>{const d=getDay(ui.date,true);d.posts=d.posts.filter(p=>p.id!==el.dataset.id);touch(dayKey(ui.date));render()},
  vtog:el=>{const k=sundayOf(el.dataset.d);S.main.virtue??={};S.main.virtue[k]??={};S.main.virtue[k][el.dataset.d]=!S.main.virtue[k][el.dataset.d];touch('main');render()},
  focusadd:()=>{const i=$('#newfocus');const t=i.value.trim();if(!t)return;weekObj().focus.push({id:nid(),t,done:false});touch('main');render();$('#newfocus').focus()},
  focustog:el=>{const f=findIn(weekObj().focus,el.dataset.id);if(f){f.done=el.checked;touch('main');render()}},
  focusdel:el=>{const w=weekObj();w.focus=w.focus.filter(x=>x.id!==el.dataset.id);touch('main');render()},
  mnew:()=>{const m={id:nid(),name:'새 만다라트',g:Array.from({length:9},()=>Array(9).fill(''))};S.main.mandals.push(m);S.main.curMandal=m.id;touch('main');render()},
  mdel:()=>{const md=curMandal();if(S.main.mandals.length<=1){md.g=Array.from({length:9},()=>Array(9).fill(''));md.name=new Date().getFullYear()+' 만다라트'}else{S.main.mandals=S.main.mandals.filter(x=>x.id!==md.id);S.main.curMandal=S.main.mandals[0].id}touch('main');render();toast('삭제했어요')},
  clsel:el=>{S.main.curList=el.dataset.id;touch('main');render()},
  clnew:()=>newChecklist('새 체크리스트',[]),
  cllistdel:()=>{const L=curList();if(!L)return;S.main.checklists=S.main.checklists.filter(x=>x.id!==L.id);S.main.curList=S.main.checklists[0]?.id||null;touch('main');render()},
  cladd:()=>{const i=$('#newcl');const t=i.value.trim();if(!t)return;curList().items.push({id:nid(),t,done:false});touch('main');render();$('#newcl').focus()},
  cltog:el=>{const it=findIn(curList().items,el.dataset.id);if(it){it.done=el.checked;touch('main');render()}},
  clidel:el=>{const L=curList();L.items=L.items.filter(x=>x.id!==el.dataset.id);touch('main');render()},
  madd:()=>{const i=$('#newm');const t=i.value.trim();if(!t)return;S.main.master.push({id:nid(),t,cat:$('#newmc').value,done:false});const c=$('#newmc').value;touch('main');render();$('#newmc').value=c;$('#newm').focus()},
  mtog:el=>{const x=findIn(S.main.master,el.dataset.id);if(x){x.done=el.checked;touch('main');render()}},
  mdel2:el=>{S.main.master=S.main.master.filter(x=>x.id!==el.dataset.id);touch('main');render()},
  mtoday:el=>{const x=findIn(S.main.master,el.dataset.id);if(!x)return;const t=TODAY(),d=getDay(t,true);const n=Math.max(0,...d.tasks.filter(y=>y.p==='B').map(y=>y.n))+1;d.tasks.push({id:nid(),p:'B',n,t:x.t,s:''});S.main.master=S.main.master.filter(y=>y.id!==x.id);touch('main');touch(dayKey(t));render();toast('오늘 업무(B)로 옮겼어요')},
  valadd:()=>{S.main.values.push({id:nid(),name:'',desc:''});touch('main');render()},
  valdel:el=>{S.main.values=S.main.values.filter(x=>x.id!==el.dataset.id);touch('main');render()},
  goaladd:()=>{S.main.goals.push({id:nid(),t:'',cat:'단기',due:'',done:false});touch('main');render()},
  goaltog:el=>{const g=findIn(S.main.goals,el.dataset.id);if(g){g.done=el.checked;touch('main');render()}},
  goaldel:el=>{S.main.goals=S.main.goals.filter(x=>x.id!==el.dataset.id);touch('main');render()},
  export:()=>textModal('내보내기 (백업)',JSON.stringify(S),true),
  import:()=>textModal('가져오기 — 백업한 내용을 붙여넣으세요','',false),
  copy:async()=>{try{await navigator.clipboard.writeText($('#mt').value);toast('복사했어요')}catch(e){$('#mt').select();toast('선택된 내용을 직접 복사해 주세요')}},
  acct:acctModal,
  gconnect:(el,e)=>{e&&e.preventDefault();gConnect()},
  grefresh:()=>{G.fetched={};gRefresh(true);render()},
  gdisc:()=>{gTok=null;G={cals:[],events:{},fetched:{},lastSync:0};try{localStorage.removeItem('fplanner.gtok');localStorage.removeItem('fplanner.gcal')}catch(e){}S.main.gcalOn=false;touch('main');render();toast('연결을 해제했어요')},
  gshow:el=>{S.main.gcalShow??={};S.main.gcalShow[el.dataset.id]=el.checked;touch('main');render()},
  gevt:el=>gEvtModal(el.dataset.d,el.dataset.id),
  google:async()=>{const p=new FB.GoogleAuthProvider();try{await FB.signInWithPopup(auth,p);closeModal()}catch(e){if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/cancelled-popup-request'].includes(e.code)){FB.signInWithRedirect(auth,p)}else if(e.code!=='auth/popup-closed-by-user')aerr(e)}},
  signin:async()=>{try{await FB.signInWithEmailAndPassword(auth,$('#em').value.trim(),$('#pw').value);closeModal()}catch(e){aerr(e)}},
  signup:async()=>{try{await FB.createUserWithEmailAndPassword(auth,$('#em').value.trim(),$('#pw').value);closeModal();toast('가입했어요')}catch(e){aerr(e)}},
  logout:async()=>{try{await FB.signOut(auth)}catch(e){}gTok=null;G={cals:[],events:{},fetched:{},lastSync:0};try{localStorage.removeItem('fplanner.gtok');localStorage.removeItem('fplanner.gcal')}catch(e){}S={main:defaultMain(),months:{}};last={};try{localStorage.removeItem('fplanner.v1')}catch(e){}closeModal();applyPrefs();render();
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(e=>console.warn(e)))}toast('로그아웃했어요')},
  savefile:()=>{const blob=new Blob([JSON.stringify(S)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='franklin-planner-backup-'+TODAY()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)},
  doimport:()=>{try{const o=JSON.parse($('#mt').value);if(!o.main)throw 0;S={main:{...defaultMain(),...o.main},months:o.months||{}};saveLocal();last={};if(user)pushAll();closeModal();applyPrefs();render();
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(e=>console.warn(e)))}toast('불러왔어요')}catch(e){toast('형식이 올바르지 않아요')}}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(f)f(el,e)});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.isComposing)return;const id=e.target.id;
  if(id==='newtask')addTask();else if(id==='newfocus')ACT.focusadd();else if(id==='newcl')ACT.cladd();else if(id==='newm')ACT.madd();else if(id==='aT')ACT.apptsave()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.addEventListener('change',async e=>{if(e.target.id==='impf'&&e.target.files[0]){$('#mt').value=await e.target.files[0].text()}});

/* ---------- bindings (typing) ---------- */
const BIND={
  task:el=>{const t=findIn(getDay(ui.date,true).tasks,el.dataset.id);if(t){t.t=el.value;touch(dayKey(ui.date))}},
  notes:el=>{getDay(ui.date,true).notes=el.value;touch(dayKey(ui.date))},
  post:el=>{const p=findIn(getDay(ui.date,true).posts,el.dataset.id);if(p){p.text=el.value;touch(dayKey(ui.date))}},
  jump:el=>{if(el.value){ui.date=el.value;render()}},
  focus:el=>{const f=findIn(weekObj().focus,el.dataset.id);if(f){f.t=el.value;touch('main')}},
  roles:el=>{weekObj().roles=el.value;touch('main')},
  mgoal:el=>{S.main.monthGoals??={};S.main.monthGoals[ui.ym]=el.value;touch('main')},
  mand:el=>{const md=curMandal(),b=+el.dataset.b,c=+el.dataset.c;md.g[b][c]=el.value;
    let mb=null,mc=null;if(b===4&&c!==4){mb=c;mc=4}else if(c===4&&b!==4){mb=4;mc=b}
    if(mb!==null){md.g[mb][mc]=el.value;const o=document.querySelector(`[data-bind=mand][data-b="${mb}"][data-c="${mc}"]`);if(o)o.value=el.value}
    touch('main')},
  msel:el=>{S.main.curMandal=el.value;touch('main');render()},
  mname:el=>{curMandal().name=el.value;touch('main')},
  cltpl:el=>{const k=el.value;if(k)newChecklist(k,TEMPLATES[k])},
  clname:el=>{curList().name=el.value;touch('main')},
  cldate:el=>{curList().date=el.value;touch('main')},
  clitem:el=>{const it=findIn(curList().items,el.dataset.id);if(it){it.t=el.value;touch('main')}},
  master:el=>{const x=findIn(S.main.master,el.dataset.id);if(x){x.t=el.value;touch('main')}},
  mission:el=>{S.main.mission=el.value;touch('main')},
  valname:el=>{const v=findIn(S.main.values,el.dataset.id);if(v){v.name=el.value;touch('main')}},
  valdesc:el=>{const v=findIn(S.main.values,el.dataset.id);if(v){v.desc=el.value;touch('main')}},
  goalt:el=>{const g=findIn(S.main.goals,el.dataset.id);if(g){g.t=el.value;touch('main')}},
  goaldue:el=>{const g=findIn(S.main.goals,el.dataset.id);if(g){g.due=el.value;touch('main')}},
  gcolor:el=>{S.main.gcalColor??={};S.main.gcalColor[el.dataset.id]=el.value;touch('main');render()},
  goalcat:el=>{const g=findIn(S.main.goals,el.dataset.id);if(g){g.cat=el.value;touch('main');render()}}
};
const RENDER_ON_CHANGE=new Set(['jump','msel','cltpl','goalcat','gcolor']);
document.addEventListener('input',e=>{const b=e.target.dataset&&e.target.dataset.bind;if(b&&BIND[b]&&!RENDER_ON_CHANGE.has(b))BIND[b](e.target)});
document.addEventListener('change',e=>{const b=e.target.dataset&&e.target.dataset.bind;if(b&&BIND[b]&&RENDER_ON_CHANGE.has(b))BIND[b](e.target)});

/* ---------- start ---------- */
(function(){const h=(location.hash||'').slice(1);if(VFN[h])ui.view=h})();
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(VFN[h]&&h!==ui.view){ui.view=h;render()}});
applyPrefs();render();
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(e=>console.warn(e)))}
// scroll the time grid near current hour on first load
</script>
</body>
</html>
